<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow" />
  <title>Admin — Alto Impacto Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

<div class="admin-layout">

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">AI</div>
      <div>
        <div class="logo-name">Alto Impacto Web</div>
        <div class="logo-sub">Panel admin</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">Menú</div>

      <button class="nav-item" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </button>

      <button class="nav-item" data-view="clients">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Clientes
      </button>
    </nav>

    <div class="sidebar-footer">
      <a href="../index.html" target="_blank" class="nav-item" style="text-decoration:none;margin-bottom:0.25rem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        Ver sitio público
      </a>
      <button class="logout-btn" id="logout-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main-area">

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger" aria-label="Menú">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar-title" id="topbar-title">Dashboard</span>
      </div>
      <div class="topbar-right">
        <span class="text-muted text-sm" id="topbar-user"></span>
      </div>
    </header>

    <!-- Content -->
    <main class="content" id="main-content">
      <!-- Rendered by app.js -->
    </main>

  </div>
</div>

<!-- ── Global Modals ── -->

<!-- Confirm dialog -->
<div class="modal-overlay confirm-modal" id="confirm-modal">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <span class="modal-title">Confirmar acción</span>
    </div>
    <div class="modal-body">
      <p id="confirm-msg" style="color:var(--text-secondary)"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="confirm-no">Cancelar</button>
      <button class="btn btn-danger" id="confirm-yes">Eliminar</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<script src="db.js"></script>
<script src="app.js"></script>
<script>
  // Show username in topbar
  try {
    const sess = JSON.parse(sessionStorage.getItem('aiw_session') || '{}');
    if (sess.user) document.getElementById('topbar-user').textContent = sess.user;
  } catch {}
</script>
</body>
</html>
